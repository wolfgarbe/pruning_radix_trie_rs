[package]
name = "pruning_radix_trie_rs"
version = "0.1.0"
description = "Pruning Radix Trie: top-k prefix completion over a term-frequency dictionary, with early termination"
license = "MIT"
keywords = ["trie", "autocomplete", "radix", "prefix", "search"]
categories = ["data-structures", "algorithms"]
authors = ["Wolf Garbe <Wolf Garbe wolf.garbe@seekstorm.com>"]
documentation = "https://docs.rs/pruning_radix_trie_rs/"
homepage = "https://github.com/wolfgarbe/pruning_radix_trie_rs"
repository = "https://github.com/wolfgarbe/pruning_radix_trie_rs"
readme = "README.md"
rust-version = '1.91'
edition = "2024"
exclude = ["benches/test_data/*.*"]

[dev-dependencies]
symspell_complete_rs = "0.0.4"
pruning_radix_trie = "1.0.1"

[[bench]]
name = "basic"
path = "benches/basic.rs"
harness = false

[dependencies]
